<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מתכנן קורות 3D</title>
<meta name="theme-color" content="#000000">
<style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Secular+One&display=swap">
<style>
:root{color-scheme:dark;--bg:#000000;--panel:#08090b;--card:#101215;--card2:#16191d;--field:#0b0c0f;--line:#23262c;--line2:#34383f;--ink:#f4f3ef;--mute:#8f949c;--accent:#ffb627;--accent-2:#ff7a45;--accent-ink:#141006;--good:#3ddc97;--good-bg:rgba(61,220,151,.1);--warn:#ffc94d;--warn-bg:rgba(255,201,77,.1);--bad:#ff6b6b;--bad-bg:rgba(255,107,107,.11);--view-ink:#e9e7e1;--view-chip:rgba(255,255,255,.06);--view-line:rgba(255,255,255,.14);
--display:"Secular One","IBM Plex Sans Hebrew",Arial,sans-serif;--body:"IBM Plex Sans Hebrew",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
#app{height:100%;display:grid;grid-template-columns:clamp(290px,23vw,340px) minmax(0,1fr) clamp(310px,26vw,390px);grid-template-rows:auto minmax(0,1fr);gap:10px;padding-block:10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--bg)}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:2px;padding-inline:6px}
.logo{width:30px;height:30px;color:var(--accent);flex:none}
h1{font-family:var(--display);font-size:22px;font-weight:400;margin:0;letter-spacing:.2px;background:linear-gradient(95deg,#fff 20%,var(--accent) 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--mute);font-size:12.5px}
.spacer{flex:1}
select,input,button{font:inherit;color:inherit}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:500;transition:border-color .15s,background .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--accent);background:var(--card2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-color:transparent;font-weight:700;box-shadow:0 4px 22px rgba(255,150,50,.28)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.side{min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;display:flex;flex-direction:column;gap:9px;padding-inline:1px;padding-block:1px 12px}
details,.beams,.block{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px}
summary{cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--mute);font-size:13px;transition:transform .15s}
details:not([open]) summary::after{transform:rotate(90deg)}
.rows{display:grid;gap:7px;padding-block:9px 2px}
.row{display:grid;grid-template-columns:1fr 106px;align-items:center;gap:10px}
.row label{font-size:13px;min-width:0;color:#d6d5d0}
.num{display:flex;align-items:center;border:1px solid var(--line);background:var(--field);border-radius:8px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.num:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,182,39,.13)}
.num input{width:100%;min-width:0;border:0;background:transparent;padding:6px 8px;font-family:var(--mono);font-size:13px;direction:ltr;text-align:left;outline:0}
.num span{padding-inline:7px;font-size:11px;color:var(--mute);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:6px 2px 4px;cursor:pointer;display:grid;justify-items:center;gap:1px;font-size:11px;color:var(--mute);transition:border-color .15s,color .15s}
.card svg{width:30px;height:30px}
.card:hover{border-color:var(--line2);color:var(--ink)}
.card[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(255,182,39,.08);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:6px;cursor:pointer;font-size:12.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(255,182,39,.08);font-weight:700}
.bar{display:grid;gap:6px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.bar b{font-size:12.5px;display:flex;align-items:center;gap:7px;font-weight:600}
.bar i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 9px currentColor}
.bar .pair{display:grid;grid-template-columns:96px 1fr;gap:7px;align-items:center}
.bar select,.row2 select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 6px;font-size:13px;min-width:0;width:100%}
.bar select{font-family:var(--mono)}
select option{background:#14161a;color:var(--ink)}
.bar .num{background:var(--card)}
.stepper{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.stepper button{border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1;padding:5px 0;color:var(--mute)}
.stepper button:hover{color:var(--accent)}
.stepper output{text-align:center;font-family:var(--mono);font-size:13px}
.beams{display:grid;gap:7px}
.row2{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px}.row2 label{font-size:13px;color:var(--mute)}
.beamBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.btn.sm{padding:5px 2px;font-size:12px;border-radius:8px}
#stage{position:relative;min-width:0;min-height:0;background:radial-gradient(90% 75% at 50% 42%,#15171b 0%,#07080a 58%,#000 100%);overflow:hidden;color:var(--view-ink);border:1px solid var(--line);border-radius:16px}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
#viewsHud{top:12px;inset-inline:12px}
#layersHud{top:47px;inset-inline:12px}
.chip{border:1px solid var(--view-line);background:var(--view-chip);color:var(--view-ink);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;backdrop-filter:blur(8px);transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="false"]{opacity:.42}
.chip.v{border-radius:8px;background:rgba(255,255,255,.08);opacity:1}
#sliders{position:absolute;bottom:12px;inset-inline:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;z-index:2;padding:9px 14px;background:rgba(12,13,16,.72);border:1px solid var(--view-line);border-radius:12px;backdrop-filter:blur(10px)}
#sliders label{display:grid;grid-template-columns:auto minmax(0,1fr) 54px;gap:9px;align-items:center;font-size:12px}
#sliders input{width:100%;accent-color:var(--accent)}
#sliders output{font-family:var(--mono);font-size:11.5px;text-align:left;direction:ltr;white-space:nowrap;color:var(--accent)}
#hint{position:absolute;bottom:68px;inset-inline-start:16px;font-size:11.5px;opacity:.5;z-index:2}
#glErr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:3}
#tip{position:absolute;z-index:4;pointer-events:none;background:rgba(12,13,16,.92);border:1px solid var(--accent);color:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.status{border-radius:13px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid transparent;font-weight:700;font-size:15px}
.st-t{display:grid;gap:3px;min-width:0}.st-t small{font-weight:500;font-size:12px;color:var(--mute)}
.ring{position:relative;width:66px;height:66px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:16px;direction:ltr}
.good{background:var(--good-bg);color:var(--good);border-color:rgba(61,220,151,.28)}.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(255,201,77,.3)}.bad{background:var(--bad-bg);color:var(--bad);border-color:rgba(255,107,107,.35)}
.util{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:grid;gap:5px;min-width:0}
.tile.wide{grid-column:1/-1}
.t-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.t-h b{font-weight:600;font-size:12.5px;min-width:0}
.t-p{font-family:var(--display);font-size:17px;direction:ltr;line-height:1}
.t-s{font-family:var(--mono);font-size:11.5px;color:var(--ink);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:3px;transition:width .3s}
.t-m{font-size:10.5px;color:var(--mute)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}

.kv span{color:var(--mute)}
.kv b{font-family:var(--mono);font-weight:500;direction:ltr;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--field);border-radius:10px;padding:3px}

.tabs button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
.pane{padding-block:10px 0}
svg text{font-family:var(--mono);fill:currentColor}
.chart{width:100%;height:auto;display:block;color:var(--ink);direction:ltr}
.chart-t{font-size:12.5px;font-weight:600;margin-block:6px 3px;color:var(--mute)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mute);font-weight:600}

table.calc td{white-space:normal}table.calc td:first-child{white-space:nowrap}table.calc td:last-child{white-space:nowrap;font-family:var(--mono);text-align:left;direction:ltr}table.calc .fm{font-family:var(--mono);font-size:11px;color:var(--mute);direction:ltr;text-align:right}
.note{font-size:11.5px;color:var(--mute);margin-block:8px 0}
.foot{font-size:11.5px;color:var(--mute);margin:2px 4px}
